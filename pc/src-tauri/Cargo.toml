[package]
name = "mini-todo"
version = "2.4.0"
description = "A minimal todo desktop app with Windows pinning support"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mini_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
# 两个插件锁在 tauri 2.9 线：更新的版本要求 tauri >= 2.10 / 2.12，会连带升级 tao / wry，
# 而窗口模式（window.rs）依赖 tao 0.34 的 apply_diff 行为、需要在 Windows 上重新做 e2e 验证
tauri-plugin-single-instance = "~2.3.7"
tauri-plugin-log = "~2.8.0"
log = "0.4"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "blocking"] }
urlencoding = "2"
flate2 = "1.1.9"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_DirectWrite", "Win32_Security_Cryptography"] }
raw-window-handle = "0.6"

[dev-dependencies]
tiny_http = "0.12"
