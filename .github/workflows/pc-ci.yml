name: PC CI

on:
  push:
    branches: [main]
    paths:
      - 'pc/**'
      - '.github/workflows/pc-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pc/**'
      - '.github/workflows/pc-ci.yml'
  workflow_dispatch:

jobs:
  rust:
    name: Rust fmt / clippy / tests (pc, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc/src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './pc/src-tauri -> target'

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked --no-fail-fast

  rust-linux:
    # 非 Windows 的 cfg 分支（托盘、桌面模式回退等）原先要到打 tag 发版才会被编译，
    # 这里在 PR 阶段就编一遍并跑一遍单测
    name: Rust clippy / tests (pc, Linux)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: pc/src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './pc/src-tauri -> target'

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked --no-fail-fast

  frontend:
    name: Frontend type check / lint / tests / build (pc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: pc/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npx vite build
