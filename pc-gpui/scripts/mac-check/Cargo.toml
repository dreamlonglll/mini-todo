# mac 专属代码的本地交叉检查（不是 pc-gpui workspace 的成员）。
#
# GPUI 的 mac 平台层（gpui-pre-apple 的 build.rs 按宿主机 cfg 生成着色器源码）与 bundled sqlite / mac-notification-sys 的
# C / ObjC 编译都离不开 macOS 宿主与 SDK，所以 Linux / Windows 上无法 `cargo check --target aarch64-apple-darwin` 整个 app。
# 但不依赖 GPUI 的 mac 代码（objc2 调 NSWindow / NSScreen、tray-icon、auto-launch、Unix socket 单实例……）是纯 Rust，
# 这里用 `#[path]` 把这些源文件原样编进来做类型检查：
#
#   rustup target add aarch64-apple-darwin
#   cargo check --manifest-path pc-gpui/scripts/mac-check/Cargo.toml --target aarch64-apple-darwin
#   cargo clippy --manifest-path pc-gpui/scripts/mac-check/Cargo.toml --target aarch64-apple-darwin -- -D warnings
#
# 依赖与特性必须和 `crates/app/Cargo.toml` 的 macOS 依赖逐项一致（版本钉成 `pc-gpui/Cargo.lock` 里的版本），否则这里能过、
# app 里不一定能过。GPUI 胶水代码仍然只有 CI 的 macOS 作业能编译。
[package]
name = "mini-todo-mac-check"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "=0.21.3", default-features = false }
auto-launch = "=0.5.0"
# 菜单栏模板图标解码（services/tray/mac_icon.rs）；特性与 app 一致
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# 不属于任何 workspace
[workspace]
