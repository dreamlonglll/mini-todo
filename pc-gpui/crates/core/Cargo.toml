[package]
name = "mini-todo-core"
description = "mini-todo 业务核心：数据库、同步、导入导出、提醒、收纳箱文件层（不依赖 GPUI / Tauri / tokio）"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "mini_todo_core"

[features]
# 对外暴露 Database::new_in_memory，供 app crate 的测试使用
test-util = []

[dependencies]
# 版本沿用旧 Tauri 版（已删除，见 git 历史）的选择：同一数据库 / 同步文档 / 导出格式，升级前先核对数据兼容
log = "0.4"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "blocking"] }
# webdav.rs 解码 PROPFIND 里的 href
urlencoding = "2"
flate2 = "1.1.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 桌面收纳箱（services/fence_fs）：监听收纳目录变化；图标位图编码为 PNG
notify = "7"
png = "0.17"
# 农历 / 节气 / 传统节日（lunar-javascript 同一作者 6tail 的 Rust 库）
tyme4rs = "1.5"

[target.'cfg(windows)'.dependencies]
# features（沿用旧 Tauri 版）：IFileOperation 移动、IShellItemImageFactory 图标、ShellExecuteExW、
# 资源管理器定位、IShellLinkW、DPAPI、DirectWrite 字体枚举
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_DirectWrite", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
# windows 0.58 的 #[implement] 宏展开后引用 ::windows_core，版本须与 windows 一致
windows-core = "0.58"

[target.'cfg(target_os = "macos")'.dependencies]
# 桌面收纳箱的 macOS 文件层（services/fence_fs/mac.rs）：renamex_np(RENAME_EXCL) 移动、NSFileManager 跨卷移动、
# NSWorkspace 图标 / 打开 / 在访达中显示、NSURL 资源属性（iCloud、替身）。
# 版本与 app 的 macOS 依赖相同（= gpui-pre-macos 用的 objc2 0.6 / objc2-foundation 0.3.2 / objc2-app-kit 0.3.2），
# Cargo 按目标统一特性，不多编一份。改这里的特性时同步改 `pc-gpui/scripts/mac-check/Cargo.toml`（本地交叉检查 mac.rs 用）
libc = "0.2"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "FoundationErrors",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "block2",
    "NSBitmapImageRep",
    "NSColorSpace",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSRunningApplication",
    "NSWorkspace",
] }

[dev-dependencies]
tiny_http = "0.12"
